<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f9f5">
  <title>TCL MCN 直播间排班</title>
  <style>
:root {
  color-scheme: light;
  --canvas: #f9f9f5;
  --surface: #fff;
  --ink: #192b36;
  --muted: #546675;
  --dim: #677883;
  --line: #dce4e5;
  --soft-line: #e8eeee;
  --table-head: #edf2f3;
  --floor-bg: #f0f6f4;
  --teal: #146459;
  --teal-tint: #e4f2ee;
  --teal-line: #c6dfd7;
  --focus: #087363;
  --coral: #a23f33;
  --coral-tint: #f9e8e2;
  --host: #3a626c;
  --host-tint: #e8f2f4;
  --assistant: #5d557f;
  --assistant-tint: #f0edf7;
  --neutral: #edf0f1;
  --gutter: clamp(22px, 4vw, 58px);
  --max: 1400px;
  font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { min-width: 0; margin: 0; color: var(--ink); background: var(--canvas); font-size: 14px; line-height: 1.5; }
button, input, select { color: inherit; font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
::selection { color: var(--teal); background: var(--teal-tint); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.skip-link {
  position: fixed;
  z-index: 10;
  top: 8px;
  left: 8px;
  padding: 8px 11px;
  border-radius: 6px;
  color: #fff;
  background: var(--teal);
  font-weight: 720;
  transform: translateY(calc(-100% - 12px));
}
.skip-link:focus { transform: none; }

.shell { width: min(100%, var(--max)); margin-inline: auto; padding-inline: var(--gutter); }
.masthead { border-bottom: 1px solid var(--line); background: var(--surface); }
.masthead-inner { display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 58px; }
.brand { display: inline-flex; align-items: center; gap: 9px; min-width: 0; font-size: 13px; font-weight: 780; line-height: 1.3; }
.brand-mark {
  display: grid;
  flex: none;
  place-items: center;
  width: 34px;
  height: 26px;
  border-radius: 5px;
  color: #fff;
  background: #ad313c;
  font: 800 10px/1 "Segoe UI", system-ui, sans-serif;
  letter-spacing: -.025em;
}
.demo-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border: 1px solid #e9d8cb;
  border-radius: 5px;
  color: #794d38;
  background: #fbf3ed;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.demo-tag[data-source="official"], .demo-tag[data-source="real"] { border-color: var(--teal-line); color: var(--teal); background: var(--teal-tint); }
.demo-tag::before, .status-chip::before {
  flex: none;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  content: "";
}
.main { min-width: 0; padding-top: 23px; padding-bottom: 28px; }
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px 20px;
  margin-bottom: 12px;
}
.page-copy { min-width: 0; }
.page-copy h1 { font-size: clamp(26px, 3vw, 35px); font-weight: 790; line-height: 1.18; letter-spacing: -.045em; }
.team-field {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  max-width: 100%;
  margin-top: 9px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 690;
}
.team-field span { flex: none; }
.team-coverage { margin-top: 5px; color: var(--muted); font-size: 12px; }
.team-field select {
  min-width: 0;
  max-width: 100%;
  min-height: 36px;
  padding: 5px 9px;
  border: 1px solid var(--teal-line);
  border-radius: 6px;
  color: var(--teal);
  background: var(--floor-bg);
  font-size: 13px;
  font-weight: 740;
}
.time-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 100%; }
.time-mode { color: var(--muted); font-size: 11px; font-weight: 650; }
.time-mode[data-live="true"] { color: var(--teal); }
.time-context {
  display: inline-flex;
  flex: none;
  align-items: stretch;
  gap: 3px;
  max-width: 100%;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.date-field, .clock-field { display: block; min-width: 0; }
.date-field select, .clock-field input, .context-reset button {
  min-height: 34px;
  min-width: 0;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: var(--surface);
}
.date-field select { max-width: 180px; font-size: 12px; font-weight: 650; }
.clock-field input {
  width: 104px;
  color: var(--teal);
  background: var(--teal-tint);
  font: 750 15px/1.15 "Segoe UI", "Microsoft YaHei UI", sans-serif;
  font-variant-numeric: tabular-nums;
}
.context-reset button { padding-inline: 7px; color: var(--teal); font-size: 11px; font-weight: 700; white-space: nowrap; }
.context-reset button:hover { border-color: var(--teal-line); background: var(--teal-tint); }

.mode-nav {
  display: flex;
  align-items: stretch;
  gap: 22px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.mode-button {
  min-height: 40px;
  padding: 6px 2px 8px;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  background: transparent;
  font-size: 13px;
  font-weight: 650;
  white-space: nowrap;
}
.mode-button:hover { color: var(--teal); }
.mode-button.is-active, .mode-button[aria-pressed="true"] { border-bottom-color: var(--teal); color: var(--teal); font-weight: 780; }

.panel { min-width: 0; }
#teamPending { margin-top: 13px; }
.panel-head { margin-block: 18px 11px; }
.panel-heading h2 { font-size: 22px; font-weight: 775; letter-spacing: -.023em; line-height: 1.25; }
.panel-heading p { margin-top: 4px; color: var(--muted); font-size: 12px; }
.floor-overview-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 11px;
  margin-block: 18px 11px;
}
.floor-overview-head h2, .floor-detail-head h2 { font-size: 22px; font-weight: 775; letter-spacing: -.023em; line-height: 1.25; }
.overview-result { color: var(--muted); font-size: 12px; }
.floor-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 11px;
}
.floor-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "name arrow" "count arrow";
  align-items: center;
  justify-items: start;
  gap: 2px 12px;
  min-width: 0;
  min-height: 97px;
  padding: 14px 17px;
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--ink);
  background: var(--surface);
  text-align: left;
  transition: border-color 120ms ease, background 120ms ease;
}
.floor-card:hover { border-color: #8dbdb0; background: #fdfefd; }
.floor-card:focus-visible { border-color: var(--focus); }
.floor-name {
  grid-area: name;
  color: var(--ink);
  font-size: 22px;
  font-weight: 785;
  line-height: 1.18;
  overflow-wrap: anywhere;
}
.floor-count { grid-area: count; color: var(--muted); font-size: 13px; font-weight: 635; }
.floor-chevron {
  display: grid;
  grid-area: arrow;
  place-items: center;
  width: 33px;
  height: 33px;
  border: 1px solid var(--teal-line);
  border-radius: 6px;
  color: var(--teal);
  background: var(--teal-tint);
  font: 720 23px/1 "Segoe UI", sans-serif;
}
.floor-chevron:empty::after { content: "›"; }
.floor-card--unconfirmed {
  grid-column: 1 / -1;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "name count arrow";
  min-height: 50px;
  padding: 7px 12px;
  border-style: dashed;
  background: transparent;
}
.floor-card--unconfirmed .floor-name { color: var(--muted); font-size: 14px; font-weight: 720; }
.floor-card--unconfirmed .floor-count { font-size: 12px; font-weight: 600; }
.floor-card--unconfirmed .floor-chevron { width: 27px; height: 27px; border-color: var(--line); color: var(--muted); background: var(--surface); font-size: 18px; }
.floor-detail-head { margin-block: 10px 11px; }
.floor-detail-head h2 { width: fit-content; max-width: 100%; overflow-wrap: anywhere; }
.back-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 35px;
  margin: 0 0 6px -5px;
  padding: 3px 5px;
  border: 0;
  border-radius: 4px;
  color: var(--teal);
  background: transparent;
  font-size: 13px;
  font-weight: 720;
}
.back-button::before { content: "←"; }
.back-button:hover { background: var(--teal-tint); }
.room-pager {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-block: 10px 0;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.pager-button {
  min-height: 36px;
  padding: 6px 10px;
  border: 1px solid var(--teal-line);
  border-radius: 6px;
  color: var(--teal);
  background: var(--surface);
  font-weight: 720;
}
.pager-button:hover:not(:disabled) { background: var(--teal-tint); }
.pager-button:disabled { border-color: var(--line); color: var(--dim); background: var(--canvas); }
.pager-label { text-align: center; }
.floor-plan {
  min-width: 0;
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.floor-plan-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 8px; margin-bottom: 6px; }
.floor-plan-head h3 { font-size: 14px; font-weight: 730; }
.floor-plan-head p { color: var(--muted); font-size: 11px; }
.plan-chips { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 5px; min-width: 0; margin: 0; padding: 0; list-style: none; }
.plan-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  max-width: 100%;
  padding: 4px 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--ink);
  background: var(--floor-bg);
  font-size: 12px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.pending-plan { margin-top: 6px; }
.pending-plan > :not(.plan-chips) + .plan-chips { margin-top: 5px; }
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 8px;
  min-width: 0;
  margin-bottom: 11px;
}
.room-filter-bar { align-items: center; }
.filter-field { display: grid; flex: 0 1 140px; gap: 3px; min-width: 0; color: var(--muted); font-size: 11px; font-weight: 700; }
.filter-field :is(input, select) {
  width: 100%;
  min-width: 0;
  min-height: 36px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
}
.filter-field input::placeholder { color: var(--muted); font-weight: 500; }
.room-search { flex: 0 1 265px; }
.person-search { flex: 0 1 320px; }
.state-select { flex: 0 1 111px; }
.result-text { align-self: flex-end; margin: 0 1px 8px auto; color: var(--muted); font-size: 12px; }
.room-filter-bar .result-text { align-self: center; margin-bottom: 0; }
.people-filter-bar .person-search, .assistant-filter-bar .person-search { flex: 1 1 215px; max-width: 320px; }
.people-status-field { flex: 0 1 148px; }
.attendance-note {
  width: fit-content;
  max-width: 100%;
  margin: -2px 0 11px;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--muted);
  background: var(--surface);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.hours-team, .hours-note { max-width: 955px; }
.hours-scope + .hours-scope { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.hours-scope-title { margin-bottom: 9px; color: var(--muted); font-size: 13px; font-weight: 720; }
.hours-team + .hours-team {
  margin-top: 16px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}
.hours-team-title {
  margin-bottom: 8px;
  color: var(--ink);
  font-size: 17px;
  font-weight: 780;
  line-height: 1.3;
}
.hours-role-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: start;
  gap: 11px;
}
.hours-role { min-width: 0; }
.hours-role-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 2px 8px;
  margin-bottom: 5px;
}
.hours-role-title { margin: 0; color: var(--teal); font-size: 14px; font-weight: 760; }
.hours-role-total { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.hours-table {
  width: 100%;
  border: 1px solid var(--line);
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 8px;
  background: var(--surface);
  table-layout: fixed;
  text-align: left;
}
.hours-table thead th {
  padding: 8px 13px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  background: var(--table-head);
  font-size: 12px;
}
.hours-table thead th:first-child { border-top-left-radius: 7px; }
.hours-table thead th:last-child { width: 39%; border-top-right-radius: 7px; }
.hours-table tbody :is(th, td) {
  height: 42px;
  padding: 7px 13px;
  border-bottom: 1px solid var(--soft-line);
  overflow-wrap: anywhere;
}
.hours-table tbody tr:last-child :is(th, td) { border-bottom: 0; }
.hours-table tbody tr:last-child :is(th, td):first-child { border-bottom-left-radius: 7px; }
.hours-table tbody tr:last-child td:last-child { border-bottom-right-radius: 7px; }
.hours-table tbody tr:hover :is(th, td) { background: #fbfdfb; }
.hours-table :is(th, td):last-child { text-align: right; }
.hours-name, .hours-table tbody th { font-weight: 720; }
.hours-value, .hours-table tbody td:last-child {
  color: var(--teal);
  font-weight: 740;
  font-variant-numeric: tabular-nums;
}
.hours-note {
  margin-top: 9px;
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.hours-note:empty { display: none; }

@media (min-width: 768px) {
  .hours-role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.roster {
  width: 100%;
  border: 1px solid var(--line);
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 9px;
  background: var(--surface);
  table-layout: fixed;
  text-align: left;
}
.roster :is(col, thead th):nth-child(1) { width: 36%; }
.roster :is(col, thead th):nth-child(2) { width: 23%; }
.roster :is(col, thead th):nth-child(3) { width: 41%; }
.roster thead th {
  padding: 9px 14px;
  position: sticky;
  z-index: 1;
  top: 0;
  border-bottom: 1px solid var(--line);
  color: #48616f;
  background: var(--table-head);
  font-size: 11px;
  font-weight: 750;
}
.roster thead th:first-child { border-top-left-radius: 8px; }
.roster thead th:last-child { border-top-right-radius: 8px; }
.roster tbody :is(td, th[scope="row"]) { height: 63px; padding: 8px 14px; border-bottom: 1px solid var(--soft-line); vertical-align: middle; }
.roster tbody:last-child tr:last-child :is(td, th) { border-bottom: 0; }
.roster tbody:last-child tr:last-child :is(td, th):first-child { border-bottom-left-radius: 8px; }
.roster tbody:last-child tr:last-child td:last-child { border-bottom-right-radius: 8px; }
.roster tbody tr:hover :is(td, th[scope="row"]) { background: #fcfdfc; }
.room-label {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  min-width: 0;
  max-width: 100%;
  padding: 0;
  border: 0;
  border-radius: 3px;
  color: var(--ink);
  background: transparent;
  font-size: 14px;
  font-weight: 760;
  line-height: 1.35;
  text-align: left;
}
button.room-label:hover .room-title { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
.room-title { min-width: 0; overflow-wrap: anywhere; }
.room-meta { min-width: 0; color: var(--muted); font-size: 11px; font-weight: 550; overflow-wrap: anywhere; }
.rid {
  display: inline-flex;
  align-items: center;
  width: max-content;
  flex: none;
  padding: 2px 5px;
  border: 1px solid #dbe4e8;
  border-radius: 4px;
  color: #345464;
  background: #f2f6f8;
  font: 750 12px/1.2 "Segoe UI", "Microsoft YaHei UI", sans-serif;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.room-time {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 5px;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.room-status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 6px; margin-top: 4px; }
.room-status .room-time { margin-top: 0; }
.period-remaining { color: var(--dim); }
.account-line, .next-account, .shift-account {
  min-width: 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 550;
  overflow-wrap: anywhere;
}
.room-time .account-line { flex: 0 1 auto; }
.status-chip {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: 4px;
  width: max-content;
  padding: 2px 5px;
  border-radius: 4px;
  color: var(--muted);
  background: var(--neutral);
  font-size: 10px;
  font-weight: 690;
  line-height: 1.25;
  white-space: nowrap;
}
.status-chip[data-state="current"] { color: var(--teal); background: var(--teal-tint); }
.status-chip[data-state="upcoming"] { color: var(--coral); background: var(--coral-tint); }
.status-chip[data-state="empty"]::before { border: 1px solid currentColor; background: transparent; }
.current-role { font-size: 14px; font-weight: 740; }
.current-role > :is(.role-value, .role, .role-person), span.current-role { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px 6px; }
.role-avatar {
  display: inline-grid;
  flex: none;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-right: 4px;
  border-radius: 5px;
  color: var(--host);
  background: var(--host-tint);
  font-size: 10px;
  font-weight: 780;
  vertical-align: -1px;
}
[data-role="assistant"] .role-avatar { color: var(--assistant); background: var(--assistant-tint); }
.role-name { overflow-wrap: anywhere; }
.role-label, .compact-label { display: block; color: var(--muted); font-size: 11px; font-weight: 580; line-height: 1.3; }
.roster .current-role .role-label { display: none; }
.current-role[data-vacant="true"] .role-name, .role-name.is-vacant, .role-missing, .pending { color: var(--dim); font-weight: 650; }
.dim, .no-shift { color: var(--dim); font-weight: 500; }
.next { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; min-width: 0; }
.next :is(time, .next-label) { color: var(--teal); font: 750 14px/1.2 "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.next-roles { color: #405a68; font-size: 12px; overflow-wrap: anywhere; }
.next-roles .pending { color: var(--coral); }
.roster .next-account { flex: 0 1 auto; }
.mobile-rooms { display: none; }

.people-grid, .assistants-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; min-width: 0; }
.person-card, .assistant-card, .handoff-room {
  min-width: 0;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.person-card-head, .person-card-identity { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.person-card-head { margin-bottom: 8px; }
.person-card-head .status-chip { margin-left: auto; }
.assistant-card { display: flex; justify-content: space-between; align-items: center; gap: 8px 13px; min-height: 51px; }
.assistant-team + .assistant-team { margin-top: 16px; }
.assistant-team-title { margin: 0 0 7px; color: var(--ink); font-size: 16px; font-weight: 750; }
.assistant-name { min-width: 0; margin: 0; font-size: 16px; font-weight: 760; overflow-wrap: anywhere; }
.assistant-card .status-chip { font-size: 11px; }
.status-chip[data-state="working"] { color: var(--teal); background: var(--teal-tint); }
.status-chip[data-state="idle"] { color: var(--muted); background: var(--neutral); }
.status-chip[data-state="idle"]::before { border: 1px solid currentColor; background: transparent; }
.person-card .status-chip[data-state="upcoming"] { color: #624e80; background: #f1ebf7; }
.status-chip[data-state="gap"] { color: #755019; background: #faeed9; }
.status-chip[data-state="rest"] { color: #3f5c76; background: #eaf1f8; }
.status-chip[data-state="conflict"] { color: #912d40; background: #fae6eb; }
.person-card[data-state="conflict"] { border-color: #e8c4ce; }
.person-name { font-size: 17px; font-weight: 760; line-height: 1.25; overflow-wrap: anywhere; }
.role-tag { padding: 2px 5px; border-radius: 4px; color: var(--host); background: var(--host-tint); font-size: 10px; font-weight: 720; }
.role-tag[data-role="assistant"] { color: var(--assistant); background: var(--assistant-tint); }
.role-tag[data-role="dual"] { color: var(--teal); background: var(--teal-tint); }
.role-tag[data-role="unknown"] { color: var(--muted); background: var(--neutral); }
.person-assignments { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.person-assignment {
  display: grid;
  grid-template-columns: minmax(0, .85fr) minmax(0, 1.35fr);
  gap: 7px;
  min-width: 0;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--canvas);
}
.person-assignment[data-state="current"] { border-color: var(--teal-line); background: var(--floor-bg); }
.person-assignment[data-state="conflict"] { border-color: #e8c4ce; background: #fff8f9; }
.person-assignment[data-state="rest"] { border-color: #dbe6ef; background: #f6f9fc; }
.assignment-when, .assignment-room { display: grid; min-width: 0; gap: 1px; align-content: start; }
.assignment-label, .assignment-platform { color: var(--muted); font-size: 11px; }
.assignment-role, .assignment-note { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.assignment-role { font-weight: 650; }
.person-conflict { margin: 2px 0 8px; padding: 5px 7px; border-radius: 5px; color: #912d40; background: #fff2f5; font-size: 11px; }
.assignment-time { font: 730 13px/1.2 "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.assignment-room-link { justify-self: start; margin: -1px -3px; padding: 1px 3px; border: 0; border-radius: 3px; color: var(--teal); background: transparent; font-size: 12px; font-weight: 700; text-align: left; overflow-wrap: anywhere; }
.assignment-room-link:hover { text-decoration: underline; text-underline-offset: 3px; }

.handoff-room + .handoff-room { margin-top: 9px; }
.handoff-head, .handoff-identity { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; min-width: 0; }
.handoff-head { width: 100%; padding: 0; border: 0; border-radius: 4px; background: transparent; text-align: left; }
.handoff-head .room-heading { font-size: 15px; font-weight: 750; }
.handoff-head .room-meta { color: var(--muted); font-size: 11px; }
.detail-link { margin-left: auto; color: var(--teal); font-size: 12px; font-weight: 700; white-space: nowrap; }
.detail-link::after { margin-left: 4px; content: "→"; }
.handoff-head:hover .detail-link { text-decoration: underline; text-underline-offset: 3px; }
.shift-track { display: flex; flex-wrap: wrap; align-items: stretch; gap: 7px; margin: 8px 0 0; padding: 0; list-style: none; }
.shift-node {
  display: grid;
  flex: 1 1 170px;
  align-content: start;
  gap: 6px;
  min-width: 0;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--canvas);
}
.shift-node[data-state="current"] { border-color: var(--teal-line); background: var(--floor-bg); }
.shift-node[data-state="empty"] { border-style: dashed; }
.shift-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 7px; }
.shift-time { color: var(--ink); font: 760 14px/1.2 "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
.shift-caption, .shift-gap { color: var(--muted); font-size: 11px; }
.shift-gap { align-self: center; justify-self: start; max-width: 100%; padding: 2px 6px; border: 1px dashed var(--line); border-radius: 4px; }
.shift-roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 125px), 1fr)); gap: 5px; }
.shift-role { display: grid; gap: 2px; min-width: 0; padding: 4px 6px; border-radius: 5px; color: var(--host); background: var(--host-tint); }
.shift-role:nth-child(2), .shift-role[data-role="assistant"] { color: var(--assistant); background: var(--assistant-tint); }
.shift-role .role-name { color: var(--ink); font-size: 13px; }

.empty-state { display: grid; justify-items: start; gap: 5px; padding: 15px; border: 1px dashed var(--line); border-radius: 7px; color: var(--muted); background: var(--surface); font-size: 13px; }
.empty-state strong { color: var(--ink); font-size: 15px; }
.empty-action { padding: 5px 8px; border: 1px solid var(--teal-line); border-radius: 5px; color: var(--teal); background: var(--teal-tint); font-weight: 700; }
.footer { margin-top: 18px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }

#detailDialog {
  width: min(600px, calc(100% - 26px));
  max-width: none;
  max-height: calc(100dvh - 26px);
  padding: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  background: var(--surface);
  box-shadow: 0 15px 55px rgb(21 43 36 / 20%);
}
#detailDialog::backdrop { background: rgb(13 27 23 / 43%); }
.detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
.detail-head h2 { font-size: 21px; line-height: 1.25; overflow-wrap: anywhere; }
.detail-head p { margin-top: 3px; color: var(--muted); font-size: 12px; }
.close-button { display: grid; flex: none; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: var(--canvas); font: 600 22px/1 "Segoe UI", sans-serif; }
.close-button:hover { color: var(--coral); background: var(--coral-tint); }
.detail-body { padding: 13px 17px 17px; }
.detail-body .shift-track { display: grid; margin-top: 0; }

@media (max-width: 920px) {
  .roster thead th, .roster tbody :is(td, th[scope="row"]) { padding-inline: 9px; }
  .people-grid, .assistants-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  :root { --gutter: clamp(11px, 3vw, 20px); }
  .masthead-inner { min-height: 47px; }
  .brand { gap: 7px; font-size: 12px; }
  .brand-mark { width: 30px; height: 23px; }
  .demo-tag { padding: 3px 6px; font-size: 10px; }
  .main { padding-top: 13px; }
  .page-header { flex-wrap: wrap; gap: 7px 12px; margin-bottom: 5px; }
  .page-copy h1 { font-size: 25px; }
  .team-field { margin-top: 5px; }

  .time-controls { align-items: flex-start; gap: 3px; }
  .time-context { padding: 2px; gap: 2px; }
  .date-field select, .clock-field input, .context-reset button { min-height: 32px; padding-inline: 4px; }
  .clock-field input { width: 94px; font-size: 14px; }
  .date-field select { max-width: 146px; }
  .context-reset button { font-size: 10px; }
  .mode-nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; margin-bottom: 8px; }
  .mode-button { min-height: 44px; padding-inline: 0; font-size: 13px; }
  .panel-head { margin-block: 12px 8px; }
  .panel-heading h2 { font-size: 18px; }
  .floor-overview-head { margin-block: 12px 8px; }
  .floor-overview-head h2, .floor-detail-head h2 { font-size: 19px; }

  .back-button { min-height: 42px; margin-bottom: 2px; }
  .pager-button { min-height: 42px; }
  .filter-bar { gap: 5px 6px; margin-bottom: 8px; }
  .filter-field { flex-basis: 100px; }
  .filter-field :is(input, select) { min-height: 39px; padding-inline: 7px; }
  .filter-field input { font-size: 16px; }
  .filter-field input::placeholder { font-size: 13px; }
  .room-search { flex: 1 1 146px; }
  .person-search { flex: 1 1 160px; }
  .state-select { flex-basis: 110px; }
  .result-text, .room-filter-bar .result-text { margin: 2px 1px 0 auto; font-size: 11px; }
  .room-filter-bar .result-text { flex: 1 0 100%; }
  .hours-table :is(th, td) { padding-inline: 8px; }
  .hours-table thead th:last-child { width: 42%; }
  .hours-note { font-size: 11px; }
  .roster, .desktop-roster { display: none; }
  .mobile-rooms { display: block; }
  .compact {
    display: block;
    width: 100%;
    min-width: 0;
    margin-bottom: 6px;
    padding: 8px 9px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    background: var(--surface);
    text-align: left;
  }
  .compact:hover { border-color: var(--teal-line); }
  .compact-head, .compact .room-label {

    font-size: 15px;
    font-weight: 760;
  }
  .compact-head .status-chip, .compact .room-label .status-chip { margin-left: auto; }
  .compact-head { flex-wrap: nowrap; justify-content: space-between; }
  .compact-head > .room-label { flex: 1 1 auto; width: auto; }

  .compact-data {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: start;
    gap: 4px 6px;
    padding-top: 6px;
    border-top: 1px solid var(--soft-line);
  }
  .compact-data > * { min-width: 0; }
  .compact-data .current-role {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    align-items: center;
    gap: 0 4px;
  }
  .compact-data .role-copy { display: contents; }

  .shift-track { display: grid; }

@media (max-width: 520px) {

  <noscript><style>.team-field,.time-controls,.mode-nav,.filter-bar,.result-text{display:none}</style></noscript>

<body>
  <a class="skip-link" href="#mainContent">跳到排班内容</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">TCL</span>
        <span class="brand-text"><strong>TCL MCN 基地</strong></span>
      </div>
      <div class="masthead-note"><span class="demo-tag" id="sourceBadge">排班试点</span></div>
    </div>
  </header>

  <main class="shell main" id="mainContent" tabindex="-1">
    <section class="page-header" aria-labelledby="mainTitle">
      <div class="page-copy">
        <h1 id="mainTitle">直播间排班</h1>
        <label class="team-field">
          <span>排班团队</span>
          <select id="teamSelect"></select>
        </label>
        <p id="teamCoverage" class="team-coverage" role="status" hidden></p>
      </div>
      <div class="time-controls">
        <span class="time-mode" id="clockMode"></span>
        <div class="time-context" role="group" aria-label="排班查看日期和时点" aria-describedby="clockMode">
          <label class="date-field"><span class="sr-only">查看日期</span><select id="daySelect"></select></label>
          <label class="clock-field"><span class="sr-only">查看时点</span><input id="asOf" type="time" value="14:30" step="60" required></label>
          <div class="context-reset"><button id="resetContext" type="button">回到示例时点</button></div>
          <span id="contextText" class="sr-only" role="status"></span>
        </div>
      </div>
    </section>

    <nav class="mode-nav" id="viewNav" aria-label="选择排班视图">
      <button type="button" class="mode-button is-active" data-view="rooms" aria-controls="roomsPanel" aria-pressed="true">
        <span class="mode-name">楼层汇总</span>
      </button>
      <button type="button" class="mode-button" data-view="people" aria-controls="peoplePanel" aria-pressed="false">
        <span class="mode-name">主播状态</span>
      </button>
      <button type="button" class="mode-button" data-view="assistants" aria-controls="assistantsPanel" aria-pressed="false">
        <span class="mode-name">助播工作</span>
      </button>
      <button type="button" class="mode-button" data-view="handoff" aria-controls="handoffPanel" aria-pressed="false">
        <span class="mode-name">全天交接</span>
      </button>
      <button type="button" class="mode-button" data-view="hours" aria-controls="hoursPanel" aria-pressed="false">
        <span class="mode-name">工时统计</span>
      </button>
    </nav>

    <section class="panel" id="teamPending" aria-label="团队排班" hidden></section>

    <section class="panel" id="roomsPanel" aria-label="楼层排班">
      <div id="roomUnavailable" hidden></div>
      <div id="floorOverview">
        <header class="floor-overview-head">
          <h2 id="roomsTitle">选择楼层</h2>
          <p id="overviewResult" class="overview-result" role="status"></p>
        </header>
        <div id="floorCards" class="floor-grid"></div>
      </div>
      <div id="floorDetail" aria-labelledby="floorTitle" hidden>
        <header class="floor-detail-head">
          <button type="button" id="backFloors" class="back-button">返回楼层汇总</button>
          <h2 id="floorTitle" tabindex="-1"></h2>
        </header>
        <div class="filter-bar room-filter-bar" id="roomFilters">
          <label class="filter-field room-search"><span class="sr-only">查找房间或主播</span><input type="search" id="roomSearch" autocomplete="off" placeholder="搜房号、房间或主播"></label>
          <label class="filter-field state-select"><span class="sr-only">房间状态</span><select id="roomState"><option value="all">全部房间</option><option value="current">仅当前有班</option></select></label>
          <p class="result-text" id="roomResult" role="status"></p>
        </div>
        <div id="roomList"></div>
        <nav id="roomPager" class="room-pager" aria-label="房间列表分页" hidden></nav>
        <section class="floor-plan" id="floorPlan" aria-labelledby="floorPlanTitle" hidden>
          <header class="floor-plan-head">
            <h3 id="floorPlanTitle">方案品类参考</h3>
            <p>运营方案第 2.2、2.3 节</p>
          </header>
          <ul id="floorPlanTeams" class="plan-chips"></ul>
        </section>
      </div>
      <noscript><div class="empty-state"><strong>请启用 JavaScript</strong><p>启用后即可读取本文件中的排班数据和使用筛选。</p></div></noscript>
    </section>

    <section class="panel" id="peoplePanel" aria-labelledby="peopleTitle" hidden>
      <header class="panel-head">
        <div class="panel-heading">
          <h2 id="peopleTitle">主播状态</h2>
          <p>按姓名查看所选日期的主播房间和班次。</p>
        </div>
      </header>
      <p class="attendance-note" id="attendanceNote" role="status" hidden></p>
      <div class="filter-bar people-filter-bar">
        <label class="filter-field person-search"><span>主播姓名</span><input id="peopleSearch" type="search" autocomplete="off" placeholder="搜索主播姓名"></label>
        <label class="filter-field people-status-field">
          <span>排班状态</span>
          <select id="peopleStatus">
            <option value="all">全部状态</option>
            <option value="current">按排班在班</option>
            <option value="gap">班间空档</option>
            <option value="rest">排班休息</option>
            <option value="upcoming">稍后有班</option>
            <option value="ended">当日排班已结束</option>
            <option value="conflict">排班冲突</option>
          </select>
        </label>
        <p class="result-text" id="peopleResult" role="status"></p>
      </div>
      <div id="peopleList"></div>
    </section>

    <section class="panel" id="assistantsPanel" aria-labelledby="assistantsTitle" hidden>
      <header class="panel-head">
        <div class="panel-heading">
          <h2 id="assistantsTitle">助播工作状态</h2>
          <p>查看所选时点的助播工作安排。</p>
        </div>
      </header>
      <div class="filter-bar assistant-filter-bar">
        <label class="filter-field person-search"><span>助播姓名</span><input id="assistantSearch" type="search" autocomplete="off" placeholder="搜索助播姓名"></label>
        <p class="result-text" id="assistantResult" role="status"></p>
      </div>
      <div id="assistantList"></div>
    </section>

    <section class="panel" id="handoffPanel" aria-labelledby="handoffTitle" hidden>
      <header class="panel-head"><div class="panel-heading"><h2 id="handoffTitle">交接安排</h2><p>查看各房间的当前班、接班人和开始时间。</p></div></header>
      <div class="filter-bar">
        <label class="filter-field"><span>楼层</span><select id="handoffFloor"><option value="all">全部楼层</option></select></label>
        <label class="filter-field"><span>班次范围</span><select id="handoffScope"><option value="next">下一班</option><option value="all">全天班次</option></select></label>
        <p class="result-text" id="handoffResult" role="status"></p>
      </div>
      <div id="handoffList"></div>
    </section>

    <section class="panel" id="hoursPanel" aria-labelledby="hoursTitle" hidden>
      <header class="panel-head">
        <div class="panel-heading">
          <h2 id="hoursTitle">排班工时</h2>
          <p id="hoursPeriod"></p>
        </div>
      </header>
      <div id="hoursList"></div>
      <p class="hours-note" id="hoursNote"></p>
    </section>

    <footer class="footer" id="sourceNote">页面显示计划排班，实际到岗以现场为准。</footer>
  </main>

  <dialog id="detailDialog" aria-labelledby="detailTitle" aria-describedby="detailMeta">
    <header class="detail-head">
      <div><h2 id="detailTitle"></h2><p id="detailMeta"></p></div>
      <button id="detailClose" class="close-button" type="button" aria-label="关闭排班详情" autofocus>×</button>
    </header>
