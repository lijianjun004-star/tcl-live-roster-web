  <script>
(() => {
  "use strict";

  const minutesPerDay = 1440;
  const dayMs = minutesPerDay * 60000;
  const byId = (id) => document.getElementById(id);
  const collator = new Intl.Collator("zh-CN", { numeric: true });
  const shanghaiClock = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  });

  const allTeams = { id: "__all-teams__", name: "全部团队" };
  let teams = [];
  let selectedTeam;
  let schedule = unavailableSchedule();
  let dataError;
  try {
    teams = readTeams(JSON.parse(byId("scheduleData")?.textContent));
    selectedTeam = teams[0];
    loadTeamSchedule();
  } catch (error) {
    dataError = error instanceof ScheduleError ? error.message : "排班数据格式有误";
  }
  let live;
  let timer;
  let selectedDay;
  let asOfMinutes;
  let selectedView = "rooms";
  let hoursRendered = false;
  let selectedFloor = null;
  let roomPage = 1;
  const roomsPerPage = 12;
  let dialogTrigger;
  let detailRoomNumber;

  const labels = {
    current: "当前有班",
    upcoming: "待开始",
    ended: "当日已结束",
    empty: "全天未排班",
  };
  const personLabels = {
    current: "按排班在班", gap: "班间空档", rest: "排班休息",
    upcoming: "稍后有班", ended: "当日排班已结束",
  };

  function clock(minutes) {
    const hours = String(Math.floor(minutes / 60)).padStart(2, "0");
    return hours + ":" + String(minutes % 60).padStart(2, "0");
  }

  function dateKey(value) {
    if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    const date = new Date(value + "T00:00:00Z");
    return !Number.isNaN(date.getTime()) && date.toISOString().slice(0, 10) === value ? value : null;
  }

  function dateStart(date) {
    return Date.parse(date + "T00:00:00Z");
  }

  function dayLabel(date, showYear = false) {
    const [year, month, day] = date.split("-").map(Number);
    const weekday = "日一二三四五六"[new Date(dateStart(date)).getUTCDay()];
    return (showYear ? year + " 年 " : "") + month + " 月 " + day + " 日 · 周" + weekday;
  }

  function parseTime(value, allowEndOfDay = false) {
    if (allowEndOfDay && value === "24:00") return minutesPerDay;
    if (typeof value !== "string" || !/^([01]\d|2[0-3]):[0-5]\d$/.test(value)) return null;
    const [hour, minute] = value.split(":").map(Number);
    return hour * 60 + minute;
  }

  function nowInShanghai() {
    const parts = Object.fromEntries(shanghaiClock.formatToParts().map(({ type, value }) => [type, value]));
    return { date: [parts.year, parts.month, parts.day].join("-"), minutes: Number(parts.hour) * 60 + Number(parts.minute) };
  }

  function textField(value) {
    return typeof value === "string" || Number.isFinite(value) ? String(value).trim() : "";
  }

  function combinedName(name) {
    return /[/／、\n]/.test(name);
  }

  function identityKey(name, id) {
    return id && !combinedName(name) ? "id:" + id : "name:" + name;
  }

  function ScheduleError(message) {
    this.message = message;
  }

  function unavailableSchedule() {
    return { mode: "unavailable", rooms: [], dates: [], roomDates: [], byRoom: new Map() };
  }

  function readTeams(data) {
    if (data?.teams === undefined) {
      return [{ id: "default", name: textField(data?.hostHoursTeam) || "当前排班", schedule: data, plannedFloors: [] }];
    }
    if (!Array.isArray(data.teams) || !data.teams.length) throw new ScheduleError("团队列表格式有误");
    const ids = new Set();
    return data.teams.map((record) => {
      const id = textField(record?.id);
      const name = textField(record?.name);
      if (!id || !name || id === allTeams.id || ids.has(id)) throw new ScheduleError("团队名称或编号有误");
      ids.add(id);
      const floorValues = Array.isArray(record.plannedFloors) ? record.plannedFloors : [];
      const plannedFloors = [...new Set(floorValues.map(textField).filter((floor) => /^\d+$/.test(floor)))].sort(compareFloors);
      return { id, name, schedule: record.schedule, pending: record.schedule == null, plannedFloors };
    });
  }

  function isPendingTeam() {
    return selectedTeam?.pending === true;
  }

  function aggregateSchedules() {
    const sources = teams.filter((team) => !team.pending)
      .map(({ id, name, schedule: data }) => ({ id, name, schedule: readSchedule(data) }));
    if (!sources.length) throw new ScheduleError("暂无已导入排班的团队");
    const result = unavailableSchedule();
    const dates = new Set();
    const roomDates = new Set();
    const restByDay = new Map();
    const directory = new Map();
    const assistants = { people: new Map(), dates: new Set() };
    const showTeam = sources.length > 1;
    for (const team of sources) {
      const source = team.schedule;
      const teamName = showTeam ? team.name : "";
      const scopedKey = (key) => JSON.stringify([team.id, key]);
      const scope = { dates: new Set(source.roomDates), coverage: source.coverage };
      for (const room of source.rooms) {
        const number = scopedKey(room.number);
        result.rooms.push({ ...room, number, sourceNumber: room.number, teamName, scope });
        result.byRoom.set(number, source.byRoom.get(room.number).map((shift) => ({
          ...shift, hostKey: shift.hostKey ? scopedKey(shift.hostKey) : "",
        })));
      }
      for (const [key, person] of source.directory) {
        const scoped = scopedKey(key);
        directory.set(scoped, { ...person, key: scoped, teamName });
      }
      for (const [date, people] of source.restByDay) {
        if (!restByDay.has(date)) restByDay.set(date, new Set());
        for (const key of people) restByDay.get(date).add(scopedKey(key));
      }
      for (const [key, person] of source.assistants.people) {
        const group = showTeam ? [team.name, person.team === team.name ? "" : person.team].filter(Boolean).join(" · ") : person.team;
        assistants.people.set(scopedKey(key), { ...person, team: group });
      }
      for (const date of source.dates) dates.add(date);
      for (const date of source.roomDates) roomDates.add(date);
      for (const date of source.assistants.dates) assistants.dates.add(date);
    }
    result.rooms.sort((a, b) => compareFloors(a.floor, b.floor)
      || collator.compare(a.displayNumber, b.displayNumber) || collator.compare(a.teamName, b.teamName));
    const first = sources[0].schedule;
    if (!assistants.people.size) {
      assistants.error = sources.find(({ schedule }) => schedule.assistants.error)?.schedule.assistants.error;
    }
    return {
      ...result, sources, directory, restByDay, assistants, dates: [...dates].sort(), roomDates: [...roomDates],
      mode: sources.some(({ schedule }) => schedule.mode === "real") ? "real" : "demo", initial: first.initial,
      coverage: showTeam ? null : first.coverage,
      sourceLabel: showTeam ? "各已导入团队排班" : first.sourceLabel,
      assistantSourceLabel: showTeam ? "各已导入团队助播排班" : first.assistantSourceLabel,
    };
  }

  function loadTeamSchedule() {
    dataError = undefined;
    schedule = unavailableSchedule();
    if (isPendingTeam()) return;
    try {
      schedule = selectedTeam === allTeams ? aggregateSchedules() : readSchedule(selectedTeam.schedule);
    } catch (error) {
      dataError = error instanceof ScheduleError ? error.message : "排班数据格式有误";
    }
  }

  function readInterval(record) {
    const date = dateKey(record?.date);
    const start = parseTime(record?.start);
    const end = parseTime(record?.end, true);
    if (!date || start === null || end === null || start === end) return null;
    const beginning = dateStart(date);
    return {
      date,
      startsAt: beginning + start * 60000,
      endsAt: beginning + (end < start ? end + minutesPerDay : end) * 60000,
    };
  }

  function collectDates(dates, interval) {
    dates.add(interval.date);
    const midnight = dateStart(interval.date) + dayMs;
    if (interval.endsAt > midnight) dates.add(new Date(midnight).toISOString().slice(0, 10));
  }

  function readSourceDate(record, interval) {
    if (record.sourceDate === undefined) return interval.date;
    const sourceDate = dateKey(record.sourceDate);
    if (!sourceDate) return null;
    const dayOffset = dateStart(interval.date) - dateStart(sourceDate);
    return dayOffset === 0 || dayOffset === dayMs ? sourceDate : null;
  }

  function readAssistants(records = [], restRecords = [], groups = []) {
    const dates = new Set();
    const people = new Map();
    const error = "独立助播排班的人员、日期或时间有误，请确认源表。";
    const invalid = () => ({ error, people: new Map(), dates: new Set() });

    function register(name, id) {
      const key = identityKey(name, textField(id));
      if (!people.has(key)) people.set(key, { name, aliases: new Set(), shifts: [], restDays: new Set() });
      const person = people.get(key);
      person.aliases.add(name);
      return person;
    }

    if (!Array.isArray(records) || !Array.isArray(restRecords)) return invalid();
    for (const record of records) {
      const name = textField(record?.name);
      const interval = readInterval(record);
      if (!name || !interval) return invalid();
      const sourceDate = readSourceDate(record, interval);
      if (!sourceDate) return invalid();
      const person = register(name, record.id);
      person.shifts.push({ ...interval, sourceDate });
      collectDates(dates, interval);
    }
    for (const record of restRecords) {
      const name = textField(record?.name);
      const date = dateKey(record?.date);
      if (!name || !date) return invalid();
      register(name, record.id).restDays.add(date);
      dates.add(date);
    }
    for (const group of Array.isArray(groups) ? groups : []) {
      const title = textField(group?.name);
      if (!title || !Array.isArray(group.members)) continue;
      for (const member of group.members) {
        const name = textField(member?.name);
        if (!name) continue;
        const person = people.get(identityKey(name, textField(member.id)));
        if (person) person.team = title;
      }
    }
    return { people, dates };
  }

  function readSchedule(data) {
    if (!data || !["demo", "real"].includes(data.mode) || !Array.isArray(data.rooms) || !Array.isArray(data.shifts)) {
      throw new ScheduleError("排班数据缺少房间或班次列表");
    }
    const rooms = [];
    const byRoom = new Map();
    const directory = new Map();
    const restByDay = new Map();

    function register(name, id, hasAssignment) {
      const key = identityKey(name, id);
      if (!directory.has(key)) {
        directory.set(key, { key, name, aliases: new Set(), hasAssignment: false, confirmed: key.startsWith("id:") });
      }
      const person = directory.get(key);
      person.aliases.add(name);
      person.hasAssignment ||= hasAssignment;
      return key;
    }
    for (const record of data.rooms) {
      const number = textField(record?.number);
      if (!number || byRoom.has(number)) throw new ScheduleError("房号缺失或重复，请检查排班表");
      byRoom.set(number, []);
      rooms.push({
        number, displayNumber: textField(record.displayNumber) || number,
        name: textField(record.name), platform: textField(record.platform),
        type: textField(record.type), floor: textField(record.floor),
      });
    }
    const dates = new Set();
    for (const record of data.shifts) {
      const roomNumber = textField(record?.roomNumber);
      const interval = readInterval(record);
      const sourceDate = interval && readSourceDate(record, interval);
      if (!byRoom.has(roomNumber) || !interval || !sourceDate) {
        throw new ScheduleError("存在房号、日期或时间不完整的班次，请检查排班表");
      }
      const host = textField(record.host);
      byRoom.get(roomNumber).push({
        startsAt: interval.startsAt, endsAt: interval.endsAt, sourceDate, host,
        platform: textField(record.platform), account: textField(record.account),
        hostKey: host ? register(host, textField(record.hostId), true) : "",
      });
      collectDates(dates, interval);
    }
    for (const record of data.restDays || []) {
      const date = dateKey(record?.date);
      const name = textField(record?.name);
      if (!date || !name) throw new ScheduleError("休息记录缺少日期或人员，请检查排班表");
      if (!restByDay.has(date)) restByDay.set(date, new Set());
      restByDay.get(date).add(register(name, textField(record.id), false));
      dates.add(date);
    }
    for (const shifts of byRoom.values()) {
      shifts.sort((first, second) => first.startsAt - second.startsAt);
      if (shifts.some((shift, index) => index > 0 && shift.startsAt < shifts[index - 1].endsAt)) {
        throw new ScheduleError("同一房间有重叠班次，请确认后重新生成看板");
      }
    }
    const initialDate = dateKey(data.initialDate);
    const initialTime = parseTime(data.initialTime);
    if (data.mode === "demo" && (!initialDate || initialTime === null)) {
      throw new ScheduleError("示例排班缺少查看日期或查看时点");
    }
    if (initialDate) dates.add(initialDate);
    const initial = initialDate && initialTime !== null ? { date: initialDate, minutes: initialTime } : null;
    const startDate = dateKey(data.coverageStart);
    const endDate = dateKey(data.coverageEnd);
    const coverage = startDate && endDate && startDate <= endDate ? { startDate, endDate } : null;
    rooms.sort((first, second) => compareFloors(first.floor, second.floor) || collator.compare(first.displayNumber, second.displayNumber));
    const assistants = readAssistants(data.assistantShifts, data.assistantRestDays, data.assistantGroups);
    return {
      mode: data.mode, rooms, dates: [...new Set([...dates, ...assistants.dates])].sort(), roomDates: [...dates],
      byRoom, initial, directory, restByDay, assistants, sourceLabel: textField(data.sourceLabel),
      assistantSourceLabel: textField(data.assistantSourceLabel), coverage,
      hoursMonth: textField(data.hoursMonth) || startDate?.slice(0, 7),
      hostHoursTeam: textField(data.hostHoursTeam),
    };
  }

  function boundaryTime(minutes) {
    if (minutes < 0) return "前日 " + clock(minutes + minutesPerDay);
    if (minutes > minutesPerDay) return "次日 " + clock(minutes - minutesPerDay);
    return clock(minutes);
  }

  function timeRange(shift) {
    return boundaryTime(shift.start) + "–" + boundaryTime(shift.end);
  }

  function durationText(minutes) {
    const hours = Math.floor(minutes / 60);
    const remainder = minutes % 60;
    if (!hours) return remainder + " 分钟";
    if (!remainder) return hours + " 小时";
    return hours + " 小时 " + remainder + " 分";
  }

  function shiftStatus(shift) {
    if (shift.end <= asOfMinutes) return "ended";
    if (shift.start > asOfMinutes) return "upcoming";
    return "current";
  }

  function assignmentSummary(shifts) {
    const current = shifts.find((shift) => shiftStatus(shift) === "current");
    const next = shifts.find((shift) => shiftStatus(shift) === "upcoming");
    let status = "empty";
    if (current) status = "current";
    else if (next) status = "upcoming";
    else if (shifts.length) status = "ended";
    return { current, next, status };
  }

  function buildRoster() {
    const day = dateStart(selectedDay);
    return schedule.rooms.flatMap((room) => {
      const shifts = schedule.byRoom.get(room.number)
        .filter((shift) => shift.startsAt < day + dayMs && shift.endsAt > day)
        .map(({ startsAt, endsAt, host, platform, account, hostKey }) => ({
          room, start: (startsAt - day) / 60000, end: (endsAt - day) / 60000, host, platform, account, hostKey,
        }));
      if (room.scope && !shifts.length &&
          (!room.scope.dates.has(selectedDay) || outsideCoverage(room.scope.coverage))) return [];
      return [{ ...room, shifts, ...assignmentSummary(shifts) }];
    });
  }

  function buildPeople(roster) {
    const people = new Map();
    const resting = schedule.restByDay.get(selectedDay) || new Set();
    const ensurePerson = (key) => {
      if (!people.has(key)) people.set(key, { ...schedule.directory.get(key), shifts: [], rest: resting.has(key) });
      return people.get(key);
    };
    for (const key of resting) ensurePerson(key);
    for (const room of roster) {
      for (const shift of room.shifts) {
        if (shift.hostKey) ensurePerson(shift.hostKey).shifts.push(shift);
      }
    }
    const ordered = [...people.values()].map((person) => {
      person.shifts.sort((first, second) => first.start - second.start);
      const summary = assignmentSummary(person.shifts);
      const currentRooms = new Set(person.shifts.filter((shift) => shiftStatus(shift) === "current")
        .map((shift) => shift.room.number));
      const restConflict = person.rest && person.shifts.length > 0;
      const simultaneous = currentRooms.size > 1 && !combinedName(person.name);
      const previousEnd = person.shifts.reduce((latest, shift) => shift.end <= asOfMinutes
        ? Math.max(latest, shift.end) : latest, 0);
      const gap = !summary.current && summary.next && previousEnd > 0
        ? { start: previousEnd, end: summary.next.start } : null;
      const status = restConflict || simultaneous ? "conflict"
        : person.rest ? "rest" : gap ? "gap" : summary.status;
      return { ...person, ...summary, status, restConflict, simultaneous, gap };
    });
    const statusOrder = ["conflict", "current", "gap", "upcoming", "rest", "ended"];
    return ordered.sort((first, second) =>
      statusOrder.indexOf(first.status) - statusOrder.indexOf(second.status) ||
      first.name.localeCompare(second.name, "zh-CN"),
    );
  }

  const modeButtons = document.querySelectorAll(".mode-button[data-view]");
  const panels = {
    rooms: byId("roomsPanel"),
    people: byId("peoplePanel"),
    assistants: byId("assistantsPanel"),
    handoff: byId("handoffPanel"),
    hours: byId("hoursPanel"),
  };
  const timeControls = document.querySelector(".time-controls");
  const teamSelect = byId("teamSelect");
  const teamCoverage = byId("teamCoverage");
  const viewNav = byId("viewNav");
  const teamPending = byId("teamPending");
  const daySelect = byId("daySelect");
  const asOf = byId("asOf");
  const contextText = byId("contextText");
  const clockMode = byId("clockMode");
  const resetContext = byId("resetContext");
  const floorOverview = byId("floorOverview");
  const floorCards = byId("floorCards");
  const overviewResult = byId("overviewResult");
  const floorDetail = byId("floorDetail");
  const floorTitle = byId("floorTitle");
  const floorPlan = byId("floorPlan");
  const floorPlanTeams = byId("floorPlanTeams");
  const backFloors = byId("backFloors");
  const roomUnavailable = byId("roomUnavailable");
  const roomFilters = byId("roomFilters");
  const roomState = byId("roomState");
  const roomSearch = byId("roomSearch");
  const roomResult = byId("roomResult");
  const roomList = byId("roomList");
  const roomPager = byId("roomPager");
  const peopleSearch = byId("peopleSearch");
  const peopleStatus = byId("peopleStatus");
  const assistantSearch = byId("assistantSearch");
  const handoffFloor = byId("handoffFloor");
  const handoffScope = byId("handoffScope");
  const detailDialog = byId("detailDialog");
  const detailClose = byId("detailClose");

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function button(className, text, onClick) {
    const control = element("button", className, text);
    control.type = "button";
    control.addEventListener("click", onClick);
    return control;
  }

  function chip(state, override) {
    const node = element("span", "status-chip", override || labels[state]);
    node.dataset.state = state;
    return node;
  }

  function outsideCoverage(coverage = schedule.coverage) {
    return coverage && (selectedDay < coverage.startDate || selectedDay > coverage.endDate);
  }

  function roomStateChip(room) {
    return chip(room.status, outsideCoverage(room.scope?.coverage) && room.status === "ended" ? "已知跨日班已结束" : undefined);
  }

  function emptyState(title, message, recovery) {
    const node = element("div", "empty-state");
    node.append(element("strong", "", title));
    if (message) node.append(element("p", "", message));
    if (recovery) node.append(button("empty-action", "清除筛选", recovery));
    return node;
  }

  function hostName(shift) {
    if (!shift) return "—";
    return shift.host || "待安排";
  }

  function hostChip(shift) {
    const node = element("span", "current-role");
    node.dataset.role = "host";
    node.dataset.vacant = String(!shift?.host);
    const copy = element("span", "role-copy");
    copy.append(element("small", "role-label", "主播"), element("strong", "role-name", hostName(shift)));
    if (shift?.host) {
      const avatar = element("span", "role-avatar", Array.from(shift.host)[0]);
      avatar.setAttribute("aria-hidden", "true");
      node.append(avatar);
    }
    node.append(copy);
    return node;
  }

  function roomMetadata(room) {
    const platform = room.platform && !room.name.includes(room.platform) ? room.platform : "";
    return [room.teamName, platform, room.type].filter(Boolean).join(" · ");
  }

  function accountLabel(shift) {
    return shift.account || shift.platform;
  }

  function roomTime(room) {
    const period = element("span", "room-time");
    if (room.current) {
      const remaining = durationText(room.current.end - asOfMinutes);
      period.append(element("strong", "", timeRange(room.current)),
        element("small", "period-remaining", "距结束 " + remaining));
      const account = accountLabel(room.current);
      if (account && account !== room.name) period.append(element("small", "account-line", account));
    } else {
      period.append(element("small", "room-no-current", "当前无班"));
    }
    return period;
  }

  function nextAssignment(room, compact = false) {
    const next = element("span", "next");
    if (compact) next.append(element("small", "compact-label", "下一班"));
    if (room.next) {
      next.append(element("strong", "next-label", (compact ? "" : "下一班 ") + clock(room.next.start)));
      const account = accountLabel(room.next);
      if (account && account !== room.name) next.append(element("span", "next-account", account));
      if (!compact) {
        next.append(element("span", "next-roles", "主播 " + hostName(room.next)));
      }
    } else {
      const label = outsideCoverage(room.scope?.coverage) ? "其余时段未覆盖" : compact ? "当日无后续" : "当日无后续班次";
      next.append(element("span", "next-label", label));
    }
    return next;
  }

  function roomIdentity(room, node = element("span", "room-label")) {
    node.append(element("span", "rid", room.displayNumber));
    if (room.name && room.name !== room.displayNumber) node.append(element("span", "room-title", room.name));
    const meta = roomMetadata(room);
    if (meta) node.append(element("small", "room-meta", meta));
    return node;
  }

  function roomRow(room) {
    const row = element("tr");
    row.dataset.state = room.status;
    row.dataset.room = room.number;
    const name = element("th");
    name.scope = "row";
    const trigger = button("room-label", undefined, () => openRoom(room, trigger));
    trigger.setAttribute("aria-label", room.displayNumber + " " + (room.name || "") + "，查看房间详情");
    const status = element("span", "room-status");
    status.append(roomStateChip(room), roomTime(room));
    name.append(roomIdentity(room, trigger), status);
    const host = element("td", "people-cell");
    host.append(hostChip(room.current));
    const next = element("td");
    next.append(nextAssignment(room));
    row.append(name, host, next);
    return row;
  }

  function roomCard(room) {
    const trigger = button("compact", undefined, () => openRoom(room, trigger));
    trigger.dataset.state = room.status;
    trigger.dataset.room = room.number;
    const head = element("span", "compact-head");
    head.append(roomIdentity(room), roomStateChip(room));
    const data = element("span", "compact-data");
    data.append(hostChip(room.current), nextAssignment(room, true));
    trigger.append(head, roomTime(room), data);
    return trigger;
  }

  function floorLabel(floor) {
    return !floor ? "楼层待确认" : /^\d+$/.test(floor) ? floor + " 楼" : floor;
  }

  function compareFloors(first, second) {
    if (!first || !second) return Number(!first) - Number(!second);
    return collator.compare(first, second);
  }

  function planChips(labels) {
    return labels.map((label) => element("li", "plan-chip", label));
  }

  function showFloorPlan(floor) {
    const plannedTeams = teams.filter((team) => team.plannedFloors.includes(floor));
    floorPlan.hidden = !plannedTeams.length;
    floorPlanTeams.replaceChildren(...planChips(plannedTeams.map((team) => team.name)));
  }

  function floorGroup(floor, rooms) {
    const label = floorLabel(floor);
    const section = element("section", "floor-group");
    const table = element("table", "roster");
    table.setAttribute("aria-label", label + "直播间排班");
    const header = element("thead");
    const columns = element("tr");
    for (const heading of ["房间", "当前主播", "下次交接"]) {
      const column = element("th", "", heading);
      column.scope = "col";
      columns.append(column);
    }
    header.append(columns);
    const rows = element("tbody");
    rows.append(...rooms.map(roomRow));
    table.append(header, rows);

    const cards = element("div", "mobile-rooms");
    cards.append(...rooms.map(roomCard));
    section.append(table, cards);
    return section;
  }

  function floorRooms(roster, floor) {
    return floor === "all" ? roster : roster.filter((room) => room.floor === floor);
  }

  function matchesRoom(room, searchTerms) {
    const sourceNumber = room.sourceNumber || room.number;
    const numberParts = /^(\d+)-(\d+)$/.exec(sourceNumber);
    const aliases = numberParts && room.floor ? [
      numberParts[1] + "-" + Number(numberParts[2]),
      `${room.floor.replace(/\s*楼$/, "")}楼${Number(numberParts[2])}号`,
      `${room.floor.replace(/\s*楼$/, "")}楼${numberParts[2]}号`,
    ] : [];
    const accounts = room.shifts.flatMap((shift) => [shift.platform, shift.account]);
    const displayLocation = room.floor ? floorLabel(room.floor).replaceAll(" ", "") + room.displayNumber : "";
    const searchable = normalizeSearch([sourceNumber, sourceNumber.replace("-", ""), room.displayNumber,
      displayLocation, room.name, room.platform, room.teamName,
      floorLabel(room.floor), room.current?.host, room.next?.host, ...aliases, ...accounts].join(" "));
    return searchTerms.every((term) => searchable.includes(term));
  }

  function resetRoomFilters() {
    roomPage = 1;
    roomState.value = "all";
    roomSearch.value = "";
  }

  function openFloor(floor) {
    selectedFloor = floor;
    resetRoomFilters();
    render();
    floorTitle.focus();
  }

  function floorCard(floor, rooms, showPlan) {
    const card = button("floor-card", undefined, () => openFloor(floor));
    card.dataset.floor = floor;
    card.classList.toggle("floor-card--unconfirmed", showPlan && !floor);
    const arrow = element("span", "floor-chevron", "›");
    arrow.setAttribute("aria-hidden", "true");
    const count = rooms.length
      ? `共 ${rooms.length} 间 · ${rooms.filter((room) => room.current).length} 间当前有班`
      : "暂无已导入排班";
    card.append(element("strong", "floor-name", floorLabel(floor)),
      element("span", "floor-count", count), arrow);
    return card;
  }

  function renderFloorOverview(roster) {
    const plannedFloors = [...new Set(teams.flatMap((team) => team.plannedFloors))];
    const groups = new Map(plannedFloors.map((floor) => [floor, []]));
    for (const room of roster) {
      if (!groups.has(room.floor)) groups.set(room.floor, []);
      groups.get(room.floor).push(room);
    }
    const result = `${roster.length} 间已导入 · ${roster.filter((room) => room.current).length} 间当前有班`;
    if (overviewResult.textContent !== result) overviewResult.textContent = result;
    const floors = [...groups.keys()].sort(compareFloors);
    floorCards.replaceChildren(...floors.map((floor) => floorCard(floor, groups.get(floor), plannedFloors.length > 0)));
    roomList.replaceChildren();
    roomPager.replaceChildren();
    roomPager.hidden = true;
  }

  function renderRoomPager(pageCount) {
    roomPager.hidden = pageCount <= 1;
    roomPager.replaceChildren();
    if (roomPager.hidden) return;
    const addPageButton = (label, direction, step) => {
      const control = button("pager-button", label, () => {
        roomPage += step;
        render();
        floorTitle.focus({ preventScroll: true });
        floorDetail.scrollIntoView({ block: "start" });
      });
      control.dataset.direction = direction;
      control.disabled = roomPage + step < 1 || roomPage + step > pageCount;
      return control;
    };
    const label = element("span", "pager-label", `第 ${roomPage} / ${pageCount} 页`);
    roomPager.append(addPageButton("上一页", "previous", -1), label, addPageButton("下一页", "next", 1));
  }

  function renderFloorDetail(roster) {
    floorTitle.textContent = floorLabel(selectedFloor);
    const visibleFloor = roster.filter((room) => room.floor === selectedFloor);
    roomFilters.hidden = !visibleFloor.length;
    showFloorPlan(selectedFloor);
    const searchTerms = normalizeSearch(roomSearch.value).replace(/[–—−]/g, "-").split(/\s+/).filter(Boolean);
    const results = visibleFloor.filter((room) =>
      (roomState.value === "all" || room.status === roomState.value) && matchesRoom(room, searchTerms),
    );
    const pageCount = Math.ceil(results.length / roomsPerPage);
    roomPage = Math.min(roomPage, Math.max(1, pageCount));
    renderRoomPager(pageCount);
    if (!results.length) {
      roomResult.textContent = "";
      roomList.replaceChildren(visibleFloor.length
        ? emptyState("没有符合筛选条件的直播间", "可换个房号或主播姓名，或清除筛选。", () => {
          resetRoomFilters();
          render();
          roomSearch.focus();
        })
        : emptyState("该楼层暂无已导入排班"));
      return;
    }
    const start = (roomPage - 1) * roomsPerPage;
    const visibleRooms = results.slice(start, start + roomsPerPage);
    const end = start + visibleRooms.length;
    const range = start + 1 === end ? String(end) : `${start + 1}–${end}`;
    const displayed = pageCount > 1 ? `显示第 ${range} 间，共 ${results.length} 间` : `共 ${results.length} 间`;
    const result = `${displayed} · ${results.filter((room) => room.current).length} 间当前有班`;
    if (roomResult.textContent !== result) roomResult.textContent = result;
    roomList.replaceChildren(floorGroup(selectedFloor, visibleRooms));
  }

  function findFloorCard(floor) {
    return [...floorCards.querySelectorAll(".floor-card")].find((card) => card.dataset.floor === floor);
  }

  function restoreRoomFocus(previous) {
    if (!previous || previous.isConnected) return;
    let replacement;
    if (previous.matches(".floor-card")) {
      replacement = findFloorCard(previous.dataset.floor);
    } else if (previous.matches(".pager-button")) {
      replacement = [...roomPager.querySelectorAll("button:not(:disabled)")]
        .find((button) => button.dataset.direction === previous.dataset.direction)
        || roomPager.querySelector("button:not(:disabled)") || floorTitle;
    } else if (previous.matches(".room-label, .compact")) {
      const roomNumber = previous.closest("[data-room]")?.dataset.room;
      const controls = roomList.querySelectorAll(".room-label, .compact");
      replacement = [...controls].find((control) =>
        control.getClientRects().length && control.closest("[data-room]")?.dataset.room === roomNumber) || floorTitle;
    } else if (previous.matches(".empty-action")) {
      replacement = roomList.querySelector(".empty-action");
    }
    replacement?.focus({ preventScroll: true });
  }

  function renderRooms(roster) {
    const focused = document.activeElement;
    roomUnavailable.hidden = true;
    floorOverview.hidden = selectedFloor !== null;
    floorDetail.hidden = selectedFloor === null;
    if (selectedFloor === null) renderFloorOverview(roster);
    else renderFloorDetail(roster);
    restoreRoomFocus(focused);
  }

  function renderRoomUnavailable(title, hint) {
    floorOverview.hidden = floorDetail.hidden = true;
    floorCards.replaceChildren();
    roomList.replaceChildren();
    roomPager.replaceChildren();
    roomPager.hidden = true;
    roomUnavailable.hidden = false;
    roomUnavailable.replaceChildren(emptyState(title, hint));
  }

  function assignmentItem(shift, person, roomsByNumber) {
    const state = shiftStatus(shift);
    const description = state === "current" ? "当前班次"
      : shift.start === person.next?.start ? "下一班" : state === "upcoming" ? "后续班次" : "已结束";
    const row = element("li", "person-assignment");
    row.dataset.state = state;
    const when = element("span", "assignment-when");
    when.append(element("span", "assignment-label", description), element("span", "assignment-time", timeRange(shift)));
    const place = element("span", "assignment-room");
    const room = roomsByNumber.get(shift.room.number);
    const roomLink = button("assignment-room-link", room.displayNumber + " · " + room.name,
      () => openRoom(room, roomLink));
    place.append(roomLink);
    const account = accountLabel(shift) || room.platform;
    if (account) place.append(element("small", "assignment-platform", account));
    row.append(when, place);
    return row;
  }

  function personnelNote(state, label, time, text) {
    const row = element("li", "person-assignment");
    row.dataset.state = state;
    const when = element("span", "assignment-when");
    when.append(element("span", "assignment-label", label), element("span", "assignment-time", time));
    row.append(when, element("span", "assignment-note", text));
    return row;
  }

  function personCard(person, roomsByNumber) {
    const card = element("article", "person-card");
    card.dataset.state = person.status;
    const head = element("header", "person-card-head");
    const identity = element("div", "person-card-identity");
    identity.append(element("h3", "person-name", person.name));
    if (person.teamName) identity.append(element("span", "role-tag", person.teamName));
    if (combinedName(person.name) || !person.hasAssignment) {
      identity.append(element("span", "role-tag", combinedName(person.name) ? "源表合写" : "休息记录"));
    }
    const overlapLabel = person.confirmed ? "同时排在多间" : "同名多间同时排班";
    const stateLabel = person.restConflict ? "休息与排班冲突"
      : person.simultaneous ? overlapLabel
      : personLabels[person.status];
    head.append(identity, chip(person.status, stateLabel));
    const assignments = element("ol", "person-assignments");
    if (person.rest) {
      assignments.append(personnelNote("rest", "源表标记：全天休息", "全天",
        person.restConflict ? "同一天也列有班次，两项均保留待核对。" : "来自排班表的明确休息标记。"));
    }
    for (const shift of person.shifts) {
      if (person.gap && shift === person.next) {
        assignments.append(personnelNote("gap", "班间空档", timeRange(person.gap), "这两段班次之间未排班。"));
      }
      assignments.append(assignmentItem(shift, person, roomsByNumber));
    }
    card.append(head);
    if (person.restConflict && person.simultaneous) {
      card.append(element("p", "person-conflict", overlapLabel + "，请同时核对地点和休息标记。"));
    } else if (person.simultaneous && !person.confirmed) {
      card.append(element("p", "person-conflict", "源表同名记录保留，是否同一人待确认。"));
    }
    card.append(assignments);
    return card;
  }

  function normalizeSearch(value) {
    return value.normalize("NFKC").trim().toLowerCase();
  }

  function renderPeople(roster) {
    const query = normalizeSearch(peopleSearch.value);
    const statusFilter = peopleStatus?.value || "all";
    const people = buildPeople(roster).filter((person) => {
      const matchesStatus = statusFilter === "all" || person.status === statusFilter;
      return matchesStatus && [...person.aliases].some((name) => normalizeSearch(name).includes(query));
    });
    const list = byId("peopleList");
    byId("peopleResult").textContent = `找到 ${people.length} 条人员记录`;
    const note = byId("attendanceNote");
    if (note) {
      const attendance = schedule.mode === "real" ? "实际到岗未确认。" : "";
      const content = "按试点房间的计划排班和原表休息名单计算。" + attendance;
      if (note.textContent !== content) note.textContent = content;
      note.hidden = false;
    }
    if (people.length) {
      const grid = element("div", "people-grid");
      const roomsByNumber = new Map(roster.map((room) => [room.number, room]));
      grid.append(...people.map((person) => personCard(person, roomsByNumber)));
      list.replaceChildren(grid);
      return;
    }
    list.replaceChildren(emptyState("未找到符合条件的主播", "试试换个姓名，或调整状态筛选。", () => {
      peopleSearch.value = "";
      if (peopleStatus) peopleStatus.value = "all";
      render();
      peopleSearch.focus();
    }));
  }

  function renderAssistants() {
    const list = byId("assistantList");
    const result = byId("assistantResult");
    const filterBar = assistantSearch.closest(".assistant-filter-bar");
    const { assistants } = schedule;
    const error = dataError || assistants?.error;
    if (error || !assistants?.people.size) {
      assistantSearch.disabled = true;
      filterBar.hidden = true;
      result.textContent = "";
      list.replaceChildren(error
        ? emptyState("独立助播排班待核对", error)
        : emptyState("源表未提供独立助播排班", "助播表只需提供姓名、日期和工作起止时间。"));
      return;
    }

    const day = dateStart(selectedDay);
    const moment = day + asOfMinutes * 60000;
    const query = normalizeSearch(assistantSearch.value);
    const people = [...assistants.people.values()].flatMap((person) => {
      const shifts = person.shifts.filter((shift) => shift.startsAt < day + dayMs && shift.endsAt > day);
      const rest = person.restDays.has(selectedDay);
      if (!shifts.length && !rest) return [];
      return [{
        ...person, working: shifts.some((shift) => shift.startsAt <= moment && moment < shift.endsAt),
        conflict: rest && person.shifts.some((shift) => shift.sourceDate === selectedDay),
      }];
    });
    assistantSearch.disabled = !people.length;
    filterBar.hidden = !people.length;
    if (!people.length) {
      result.textContent = "";
      list.replaceChildren(emptyState("当日未读到助播排班记录", "可切换日期查看已有的独立排班。"));
      return;
    }

    const matches = people.filter((person) => [...person.aliases].some((name) => normalizeSearch(name).includes(query)))
      .sort((first, second) => Number(second.working) - Number(first.working) || collator.compare(first.name, second.name));
    result.textContent = `显示 ${matches.length} 人 · ${matches.filter((person) => person.working).length} 人有工作`;
    if (!matches.length) {
      list.replaceChildren(emptyState("未找到符合条件的助播", "可换一个姓名再查。", () => {
        assistantSearch.value = "";
        renderAssistants();
        assistantSearch.focus();
      }));
      return;
    }

    const grids = new Map();
    const showGroups = [...assistants.people.values()].some((person) => person.team);
    for (const person of matches) {
      const team = person.team || "";
      if (!grids.has(team)) grids.set(team, element("div", "assistants-grid"));
      const card = element("article", "assistant-card");
      const state = person.working ? "working" : "idle";
      card.dataset.state = state;
      card.append(element(showGroups ? "h4" : "h3", "assistant-name", person.name),
        chip(state, person.working ? "有工作" : "当前无工作"));
      grids.get(team).append(card);
    }
    const sections = [...grids].sort(([first], [second]) => Number(!first) - Number(!second) || collator.compare(first, second))
      .map(([team, grid]) => {
        if (!showGroups) return grid;
        const section = element("section", "assistant-team");
        section.append(element("h3", "assistant-team-title", team || "未分组记录"), grid);
        return section;
      });
    const conflicts = matches.filter((person) => person.conflict);
    if (conflicts.length) {
      const names = conflicts.map((person) => person.name).join("、");
      const note = element("p", "attendance-note assistant-conflict-note",
        names + "在源表同日同时列有休息与工作时段。请核对排班，卡片按工作时段显示。");
      note.setAttribute("role", "status");
      list.replaceChildren(note, ...sections);
    } else {
      list.replaceChildren(...sections);
    }
  }

  function monthWindow(month) {
    const firstDay = dateKey(month + "-01");
    if (!firstDay) return null;
    const startsAt = dateStart(firstDay);
    const next = new Date(startsAt);
    next.setUTCMonth(next.getUTCMonth() + 1);
    const endsAt = next.getTime();
    const [year, monthNumber] = month.split("-").map(Number);
    const lastDay = new Date(endsAt - dayMs).getUTCDate();
    return { startsAt, endsAt, year, monthNumber, lastDay };
  }

  function monthHasDate(bounds, date) {
    const stamp = dateStart(date);
    return stamp >= bounds.startsAt && stamp < bounds.endsAt;
  }

  function unionMinutes(shifts) {
    let covered = 0;
    let previousEnd = -Infinity;
    for (const shift of [...shifts].sort((first, second) => first.startsAt - second.startsAt)) {
      const start = Math.max(shift.startsAt, previousEnd);
      const end = shift.endsAt;
      if (end > start) {
        covered += end - start;
        previousEnd = end;
      }
    }
    return covered / 60000;
  }

  function hostHours(bounds, source) {
    const people = new Map();
    const keysByName = new Map();
    for (const person of source.directory.values()) {
      if (combinedName(person.name)) continue;
      for (const name of person.aliases) {
        if (!keysByName.has(name)) keysByName.set(name, new Set());
        keysByName.get(name).add(person.key);
      }
    }

    function register(key, name) {
      if (!people.has(key)) {
        people.set(key, { name: source.directory.get(key)?.name || name, shifts: [] });
      }
      return people.get(key);
    }

    for (const shifts of source.byRoom.values()) {
      for (const shift of shifts) {
        if (!monthHasDate(bounds, shift.sourceDate)) continue;
        const names = new Set(shift.host.split(/[/／、]/).map((name) => name.trim()).filter(Boolean));
        for (const name of names) {
          const keys = keysByName.get(name);
          const key = shift.host === name ? shift.hostKey
            : keys?.size === 1 ? keys.values().next().value : identityKey(name, "");
          register(key, name).shifts.push(shift);
        }
      }
    }
    for (const [date, resting] of source.restByDay) {
      if (!monthHasDate(bounds, date)) continue;
      for (const key of resting) register(key, source.directory.get(key).name);
    }
    return [...people.values()].map((person) => ({ name: person.name, minutes: unionMinutes(person.shifts) }));
  }

  function assistantHours(bounds, source) {
    return [...source.assistants.people.values()].flatMap((person) => {
      const shifts = person.shifts.filter((shift) => monthHasDate(bounds, shift.sourceDate));
      const minutes = unionMinutes(shifts);
      const rest = [...person.restDays].some((date) => monthHasDate(bounds, date));
      return minutes || rest ? [{ name: person.name, team: person.team, minutes }] : [];
    });
  }

  function hoursText(minutes) {
    return minutes ? durationText(minutes) : "0 小时";
  }

  function hoursRoleSection(team, role, people) {
    const label = role === "hosts" ? "主播" : "助播";
    const section = element("section", "hours-role");
    section.dataset.role = role;
    const heading = element("div", "hours-role-head");
    const totalMinutes = people.reduce((sum, person) => sum + person.minutes, 0);
    const total = element("p", "hours-role-total", `${people.length} 人 · ${hoursText(totalMinutes)}`);
    total.dataset.minutes = String(totalMinutes);
    heading.append(element("h4", "hours-role-title", label), total);
    const table = element("table", "hours-table");
    table.setAttribute("aria-label", team + label + "月度排班工时");
    const header = element("thead");
    const columns = element("tr");
    for (const title of ["姓名", "排班工时"]) {
      const column = element("th", "", title);
      column.scope = "col";
      columns.append(column);
    }
    header.append(columns);
    const body = element("tbody");
    for (const person of people.sort((first, second) => collator.compare(first.name, second.name))) {
      const row = element("tr");
      const name = element("th", "hours-name", person.name);
      name.scope = "row";
      row.append(name);
      const time = element("td", "hours-value", hoursText(person.minutes));
      time.dataset.minutes = String(person.minutes);
      row.append(time);
      body.append(row);
    }
    table.append(header, body);
    section.append(heading, table);
    return section;
  }

  function renderHours() {
    if (hoursRendered) return;
    hoursRendered = true;
    const list = byId("hoursList");
    if (dataError) {
      list.append(emptyState("排班数据待核对", dataError));
      return;
    }
    const sources = schedule.sources || [{ id: selectedTeam?.id, name: selectedTeam?.name, schedule }];
    if (!sources.length) {
      list.append(emptyState("暂无已导入团队的工时", "团队导入排班后可查看各人员的累计排班工时。"));
      return;
    }
    const multiple = sources.length > 1;
    const period = byId("hoursPeriod");
    const policy = "月末夜班完整计入。同格多名主播各计完整时长，同一人同角色的重叠时段只计一次。";
    if (multiple) period.textContent = "各团队分别按源表日期列统计";
    byId("hoursNote").textContent = multiple ? "各团队分别统计。" + policy : policy;

    for (const { id, name, schedule: source } of sources) {
      const bounds = monthWindow(source.hoursMonth);
      const scope = multiple ? element("section", "hours-scope") : list;
      if (multiple) {
        scope.dataset.team = id;
        const heading = element("header", "hours-scope-head");
        heading.append(element("h3", "hours-scope-title", name));
        if (bounds) {
          heading.append(element("p", "hours-scope-period",
            `${bounds.year} 年 ${bounds.monthNumber} 月 1 日–${bounds.lastDay} 日`));
        }
        scope.append(heading);
        list.append(scope);
      }
      if (!bounds) {
        if (!multiple) byId("hoursNote").textContent = "";
        scope.append(emptyState("工时统计月份待确认", "确认统计月份后可查看各人员的累计排班工时。"));
        continue;
      }
      if (!multiple) {
        period.textContent = `${bounds.year} 年 ${bounds.monthNumber} 月 1 日–${bounds.lastDay} 日 · 按源表日期列`;
      }

      const teams = new Map();
      function teamFor(teamName) {
        const label = teamName || "未分组";
        if (!teams.has(label)) teams.set(label, { hosts: [], assistants: [] });
        return teams.get(label);
      }

      const hosts = hostHours(bounds, source);
      if (hosts.length) teamFor(source.hostHoursTeam || name).hosts = hosts;
      for (const person of assistantHours(bounds, source)) teamFor(person.team).assistants.push(person);

      for (const [team, roles] of teams) {
        const section = element("section", "hours-team");
        const grid = element("div", "hours-role-grid");
        for (const [role, people] of Object.entries(roles)) {
          if (people.length) grid.append(hoursRoleSection(team, role, people));
        }
        section.append(element("h3", "hours-team-title", team), grid);
        scope.append(section);
      }

      if (source.assistants.error) scope.append(emptyState("助播工时待核对", source.assistants.error));
      else if (!teams.size) scope.append(emptyState("本月暂无排班工时", "请确认本月的主播或助播排班。"));
    }
  }

  function shiftNode(shift, next) {
    const state = shift ? shiftStatus(shift) : "empty";
    const node = element("li", "shift-node");
    node.dataset.state = state;
    const time = element("span", "shift-time", shift ? timeRange(shift) : "查看时点");
    const description = !shift ? "当前无班" : state === "current" ? "当前班次"
      : shift === next ? "下一班" : state === "upcoming" ? "后续班次" : "已结束";
    const head = element("div", "shift-head");
    head.append(time, chip(state, description));
    node.append(head);
    if (shift) {
      const account = accountLabel(shift);
      if (account) node.append(element("div", "shift-account", account));
      const people = element("div", "shift-roles");
      const roleLine = element("span", "shift-role");
      roleLine.append(element("span", "role-label", "主播"), element("strong", "role-name", hostName(shift)));
      people.append(roleLine);
      node.append(people);
    } else {
      node.append(element("p", "shift-caption", "该时段没有排班"));
    }
    return node;
  }

  function shiftTrack(room, shifts) {
    const track = element("ol", "shift-track");
    for (const [index, shift] of shifts.entries()) {
      const previous = shifts[index - 1];
      if (previous && shift && previous.end < shift.start) {
        const gap = element("li", "shift-gap", `空档 ${boundaryTime(previous.end)}–${boundaryTime(shift.start)}`);
        track.append(gap);
      }
      track.append(shiftNode(shift, room.next));
    }
    return track;
  }

  function handoffRoom(room, showNext) {
    const article = element("article", "handoff-room");
    article.dataset.room = room.number;
    const header = button("handoff-head", undefined, () => openRoom(room, header));
    const title = element("span", "handoff-identity");
    title.append(element("span", "room-id", room.displayNumber));
    if (room.name && room.name !== room.displayNumber) title.append(element("span", "room-heading", room.name));
    const meta = [room.teamName, room.platform].filter(Boolean).join(" · ");
    if (meta) title.append(element("span", "room-meta", meta));
    header.append(title, element("span", "detail-link", "房间详情"));
    article.append(header, shiftTrack(room, showNext ? [room.current, room.next] : room.shifts));
    return article;
  }

  function renderHandoff(roster) {
    const showNext = handoffScope.value === "next";
    const available = floorRooms(roster, handoffFloor.value);
    const selected = showNext
      ? available.filter((room) => room.next).sort((left, right) => left.next.start - right.next.start)
      : available.filter((room) => room.shifts.length);
    byId("handoffResult").textContent = showNext
      ? `${selected.length} 间有后续班次 · 按下一班时间排序`
      : `${selected.length} 间当天有班 · 按房号排序`;
    const list = byId("handoffList");
    if (selected.length) {
      list.replaceChildren(...selected.map((room) => handoffRoom(room, showNext)));
      return;
    }
    list.replaceChildren(emptyState(
      showNext ? "所选楼层没有后续班次" : "所选楼层当天暂无排班",
      showNext ? "切换为全天班次，仍可回看当天排班。" : "试试选择其他楼层或日期。",
    ));
  }

  function openRoom(room, trigger) {
    dialogTrigger = trigger;
    detailRoomNumber = room.number;
    updateRoomDialog(room);
    detailDialog.showModal();
    detailClose.focus();
  }

  function updateRoomDialog(room) {
    byId("detailTitle").textContent = [room.displayNumber, room.name !== room.displayNumber ? room.name : ""].filter(Boolean).join(" ");
    byId("detailMeta").textContent = [dayLabel(selectedDay, true), floorLabel(room.floor), room.teamName, room.platform,
      "查看时点 " + clock(asOfMinutes)]
      .filter(Boolean).join(" · ");
    byId("detailContent").replaceChildren(room.shifts.length
      ? shiftTrack(room, room.shifts)
      : emptyState("当天暂无排班", "可切换日期查看其他天的安排。"));
  }

  function render() {
    if (isPendingTeam()) return;
    const context = dayLabel(selectedDay, true) + " / " + clock(asOfMinutes) + (live ? " · 北京时间" : "");
    if (contextText.textContent !== context) contextText.textContent = context;
    const mode = live ? "北京时间 · 自动更新" : schedule.mode === "demo" ? "示例时点" : "北京时间 · 手动查看";
    if (clockMode.textContent !== mode) clockMode.textContent = mode;
    clockMode.dataset.live = String(live);
    updateSourceNote();
    if (selectedView === "hours") {
      renderHours();
      return;
    }
    if (selectedView === "assistants") {
      renderAssistants();
      return;
    }
    if (dataError || !schedule.rooms.length || !schedule.roomDates.includes(selectedDay)) {
      const title = dataError || (!schedule.rooms.length ? "源表暂无可显示的房间"
        : outsideCoverage() ? "排班表未覆盖此日期" : "所选日期暂无源表班次");
      const hint = dataError ? "请检查源表并重新生成看板。" : "可切换查看日期，或请排班负责人确认。";
      if (selectedView === "rooms") renderRoomUnavailable(title, hint);
      else {
        const prefix = selectedView === "people" ? "people" : "handoff";
        byId(prefix + "List").replaceChildren(emptyState(title, hint));
        byId(prefix + "Result").textContent = "";
      }
      return;
    }
    const knownRoster = buildRoster();
    const roster = outsideCoverage() ? knownRoster.filter((room) => room.shifts.length) : knownRoster;
    if (selectedView === "rooms") renderRooms(roster);
    else if (selectedView === "people") renderPeople(roster);
    else renderHandoff(roster);
    if (detailDialog.open && detailRoomNumber) {
      const openRecord = roster.find((room) => room.number === detailRoomNumber);
      if (openRecord) updateRoomDialog(openRecord);
    }
  }

  function setView(view) {
    selectedView = view;
    const pending = isPendingTeam();
    timeControls.hidden = pending || view === "hours";
    viewNav.hidden = pending;
    teamPending.hidden = !pending;
    if (view === "rooms") {
      selectedFloor = null;
      resetRoomFilters();
    }
    for (const [key, panel] of Object.entries(panels)) panel.hidden = pending || key !== view;
    for (const control of modeButtons) {
      const active = control.dataset.view === view;
      control.classList.toggle("is-active", active);
      control.setAttribute("aria-pressed", String(active));
    }
    if (pending) {
      teamPending.replaceChildren(emptyState(selectedTeam.name + "待导入排班",
        "楼层待确认。导入排班表后可查看房间、人员状态和工时。"));
      if (selectedTeam.plannedFloors.length) {
        const plan = element("section", "floor-plan pending-plan");
        const heading = element("h3", "", "方案楼层参考");
        const list = element("ul", "plan-chips");
        list.append(...planChips(selectedTeam.plannedFloors.map(floorLabel)));
        plan.append(heading, list);
        teamPending.append(plan);
      }
      byId("sourceNote").hidden = true;
    } else {
      teamPending.replaceChildren();
      render();
    }
  }

  function setDateOptions() {
    const items = [...new Set([...schedule.dates, selectedDay])].sort();
    daySelect.replaceChildren(...items.map((date) => {
      const weekday = "日一二三四五六"[new Date(dateStart(date)).getUTCDay()];
      return new Option(date.replaceAll("-", "/") + " 周" + weekday, date);
    }));
    daySelect.value = selectedDay;
  }

  function setFloorOptions() {
    const floors = [...new Set(schedule.rooms.map((room) => room.floor))].sort(compareFloors);
    handoffFloor.replaceChildren(new Option("全部楼层", "all"), ...floors.map((floor) => new Option(floorLabel(floor), floor)));
  }

  function suspendClock() {
    live = false;
    window.clearTimeout(timer);
  }

  function refreshClock() {
    if (!live) return;
    window.clearTimeout(timer);
    const now = nowInShanghai();
    if (now.date !== selectedDay || now.minutes !== asOfMinutes) {
      if (now.date !== selectedDay) {
        selectedDay = now.date;
        setDateOptions();
      }
      asOfMinutes = now.minutes;
      asOf.value = clock(asOfMinutes);
      render();
    }
    timer = window.setTimeout(refreshClock, 60000 - Date.now() % 60000 + 10);
  }

  function setClockContext() {
    live = schedule.mode === "real";
    ({ date: selectedDay, minutes: asOfMinutes } = live ? nowInShanghai() : schedule.initial || nowInShanghai());
    setDateOptions();
    asOf.value = clock(asOfMinutes);
  }

  function resetTime() {
    setClockContext();
    render();
    refreshClock();
  }

  function switchTeam() {
    const next = teamSelect.value === allTeams.id ? allTeams : teams.find((team) => team.id === teamSelect.value);
    if (!next || next === selectedTeam) return;
    window.clearTimeout(timer);
    selectedTeam = next;
    loadTeamSchedule();
    if (detailDialog.open) detailDialog.close();
    selectedFloor = null;
    resetRoomFilters();
    peopleSearch.value = "";
    peopleStatus.value = "all";
    assistantSearch.value = "";
    handoffScope.value = "next";
    hoursRendered = false;
    byId("hoursList").replaceChildren();
    byId("hoursPeriod").textContent = "";
    byId("hoursNote").textContent = "";
    setClockContext();
    setFloorOptions();
    describeSource();
    setView(selectedView);
    refreshClock();
  }

  function describeSource() {
    teamCoverage.hidden = selectedTeam !== allTeams || Boolean(dataError);
    if (!teamCoverage.hidden) {
      const loaded = schedule.sources.length;
      const pending = teams.length - loaded;
      teamCoverage.textContent = `${loaded} 个团队已导入` + (pending ? ` · ${pending} 个待导入` : "");
    }
    const badge = byId("sourceBadge");
    if (badge) {
      badge.dataset.source = isPendingTeam() ? "pending" : dataError ? "error" : schedule.mode;
      const badgeLabels = { pending: "待导入排班", error: "排班数据待检查", demo: "排班试点 · 示例数据", real: "排班试点 · 源表数据" };
      badge.textContent = badgeLabels[badge.dataset.source];
    }
    resetContext.textContent = schedule.mode === "real" ? "回到当前" : "回到示例时点";
  }

  function updateSourceNote() {
    const note = byId("sourceNote");
    if (!note) return;
    note.hidden = selectedView === "assistants" && !schedule.assistants?.people.size;
    if (note.hidden) return;
    if (selectedView === "assistants") {
      const source = schedule.assistantSourceLabel ? "来源 " + schedule.assistantSourceLabel + "。" : "";
      const content = source + "按北京时间查看独立排班的工作时段和明确休息记录。";
      if (note.textContent !== content) note.textContent = content;
      return;
    }
    if (selectedView === "hours") {
      const hostSource = schedule.sourceLabel ? "主播来源 " + schedule.sourceLabel + "。" : "";
      const assistantSource = schedule.assistantSourceLabel ? "助播来源 " + schedule.assistantSourceLabel + "。" : "";
      const content = hostSource + assistantSource;
      if (note.textContent !== content) note.textContent = content;
      return;
    }
    const summary = schedule.mode === "demo" ? "页面使用示例排班演示。"
      : schedule.mode === "real" ? "页面使用导入的计划排班。" : "未读取有效的排班数据。";
    const source = schedule.sourceLabel ? "来源 " + schedule.sourceLabel + "。" : "";
    const coverage = outsideCoverage() ? "排班表未覆盖完整日期，仅显示已知跨日班次。" : "";
    const content = source + summary + coverage + "实际到岗以现场为准。";
    if (note.textContent !== content) note.textContent = content;
  }

  teamSelect.addEventListener("change", switchTeam);
  for (const control of modeButtons) control.addEventListener("click", () => setView(control.dataset.view));
  backFloors.addEventListener("click", () => {
    const previousFloor = selectedFloor;
    setView("rooms");
    findFloorCard(previousFloor)?.focus();
  });
  daySelect.addEventListener("change", () => {
    if (!dateKey(daySelect.value)) return;
    suspendClock();
    selectedDay = daySelect.value;
    render();
  });
  function updateAsOf() {
    const nextTime = parseTime(asOf.value);
    if (nextTime === null) return;
    if (nextTime !== asOfMinutes) {
      suspendClock();
      asOfMinutes = nextTime;
      render();
    }
  }
  asOf.addEventListener("input", updateAsOf);
  asOf.addEventListener("change", () => {
    if (!asOf.value) asOf.value = clock(asOfMinutes);
    else updateAsOf();
  });
  resetContext.addEventListener("click", resetTime);
  for (const control of [handoffFloor, handoffScope]) {
    control.addEventListener("change", render);
  }
  function filterRooms() {
    roomPage = 1;
    render();
  }
  roomSearch.addEventListener("input", filterRooms);
  roomState.addEventListener("change", filterRooms);
  peopleStatus?.addEventListener("change", render);
  for (const search of [peopleSearch, assistantSearch]) search.addEventListener("input", render);
  detailClose.addEventListener("click", () => detailDialog.close());
  detailDialog.addEventListener("close", () => {
    if (dialogTrigger?.isConnected) dialogTrigger.focus();
    else {
      const replacement = Array.from(panels[selectedView].querySelectorAll("[data-room]")).find((row) =>
        row.dataset.room === detailRoomNumber && row.getClientRects().length,
      );
      (replacement?.matches("button") ? replacement : replacement?.querySelector("button"))?.focus();
    }
    detailRoomNumber = undefined;
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshClock();
  });
  window.addEventListener("focus", refreshClock);
  window.addEventListener("pageshow", refreshClock);

  teamSelect.replaceChildren(...teams.map((team) =>
    new Option(team.pending ? team.name + "（待导入）" : team.name, team.id),
  ));
  if (teams.length > 1) teamSelect.add(new Option(allTeams.name, allTeams.id), 0);
  teamSelect.value = selectedTeam?.id || "";
  teamSelect.disabled = teams.length < 2;
  setFloorOptions();
  describeSource();
  setClockContext();
  setView("rooms");
  refreshClock();
})();
</script>
</body>
</html>
